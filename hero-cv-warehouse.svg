<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-label="Computer-vision work measurement paired with warehouse automation">
<defs>
  <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15202c"/><stop offset="1" stop-color="#0e0e0d"/></linearGradient>
  <radialGradient id="hglow1" cx="0.72" cy="0.18" r="0.55"><stop offset="0" stop-color="#6a9bcc" stop-opacity="0.35"/><stop offset="1" stop-color="#6a9bcc" stop-opacity="0"/></radialGradient>
  <radialGradient id="hglow2" cx="0.18" cy="0.85" r="0.5"><stop offset="0" stop-color="#EE8329" stop-opacity="0.28"/><stop offset="1" stop-color="#EE8329" stop-opacity="0"/></radialGradient>
  <radialGradient id="hglow3" cx="0.85" cy="0.8" r="0.4"><stop offset="0" stop-color="#D97757" stop-opacity="0.22"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient>
  <pattern id="hgrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8ab5e0" stroke-opacity="0.08"/></pattern>
</defs>
<rect width="900" height="720" rx="18" fill="url(#hbg)"/>
<rect width="900" height="720" rx="18" fill="url(#hgrid)"/>
<rect width="900" height="720" rx="18" fill="url(#hglow1)"/>
<rect width="900" height="720" rx="18" fill="url(#hglow2)"/>
<rect width="900" height="720" rx="18" fill="url(#hglow3)"/>

<!-- Operator with tracked motion path -->
<g stroke="#8ab5e0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="300" cy="240" r="34"/>
  <path d="M300 274 V400 M300 305 L215 375 M300 305 L390 365 M300 400 L250 500 M300 400 L355 495"/>
</g>
<g fill="#EE8329">
  <circle cx="300" cy="240" r="6"/><circle cx="300" cy="305" r="7"/><circle cx="215" cy="375" r="7"/><circle cx="390" cy="365" r="7"/>
  <circle cx="300" cy="400" r="7"/><circle cx="250" cy="500" r="7"/><circle cx="355" cy="495" r="7"/>
</g>
<path d="M405 350 l40 -22 l42 16 l4 42 l-36 24 l-44 -12 z" fill="none" stroke="#D97757" stroke-width="4"/>
<text x="427" y="358" font-family="monospace" font-size="17" fill="#D97757" text-anchor="middle">ROI</text>

<!-- camera -->
<g stroke="#6a9bcc" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <rect x="130" y="150" width="86" height="58" rx="10"/><circle cx="173" cy="179" r="14"/>
  <path d="M216 165 l40 -18 v64 l-40 -18"/>
</g>
<g stroke="#8ab5e0" stroke-opacity="0.35" stroke-width="2"><path d="M270 175 L620 300" /><path d="M270 190 L470 335"/></g>

<!-- live metrics panel -->
<rect x="560" y="150" width="270" height="150" rx="14" fill="#0e0e0d" fill-opacity="0.7" stroke="#6a9bcc" stroke-width="2.5"/>
<circle cx="586" cy="176" r="6" fill="#EE8329"/>
<text x="602" y="181" font-family="monospace" font-size="14" fill="#8ab5e0">LINE ANDON · LIVE</text>
<text x="585" y="222" font-family="'Space Grotesk',monospace" font-weight="700" font-size="30" fill="#7ed492">ON PACE</text>
<text x="585" y="256" font-family="monospace" font-size="15" fill="#b7c2cd">CYCLE 11.3s · DEV 0</text>
<text x="585" y="280" font-family="monospace" font-size="15" fill="#f5a85e">BENCHMARK 11.0s</text>

<!-- warehouse racking, lower half -->
<g stroke="#6a9bcc" stroke-width="3.5" fill="none">
  <path d="M120 640 V500 M240 640 V500 M120 540 H240 M120 580 H240 M120 620 H240"/>
</g>
<g stroke="#8ab5e0" stroke-width="2.4" stroke-dasharray="6 7" fill="none" opacity="0.75">
  <path d="M330 640 V480 M450 640 V480 M330 520 H450 M330 560 H450 M330 600 H450 M330 640 H450"/>
</g>
<g fill="#EE8329"><circle cx="240" cy="540" r="6"/><circle cx="120" cy="580" r="6"/><circle cx="240" cy="620" r="6"/></g>
<g fill="none" stroke="#EE8329" stroke-opacity="0.5"><circle cx="240" cy="540" r="13"/><circle cx="120" cy="580" r="13"/><circle cx="240" cy="620" r="13"/></g>
<path d="M480 590 C 545 545, 600 545, 660 585" stroke="#D97757" stroke-width="3" fill="none"/>
<path d="M660 585 l-13 -4 m13 4 l-4 -13" stroke="#D97757" stroke-width="3" fill="none"/>

<!-- PEB frame silhouette, right side -->
<g stroke="#6a9bcc" stroke-width="3" fill="none" opacity="0.85">
  <path d="M700 640 V520 L785 460 L870 520 V640"/>
  <path d="M785 640 V460"/>
</g>
<path d="M700 520 L785 460 L870 520" fill="none" stroke="#EE8329" stroke-width="4" stroke-linecap="round"/>

<text x="450" y="690" font-family="monospace" font-size="18" fill="#8595a5" text-anchor="middle">WORK MEASUREMENT · WAREHOUSE AUTOMATION</text>
</svg>
